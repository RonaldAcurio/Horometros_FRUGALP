<div class="layout-container">
  <!-- Header Principal Global -->
  <header class="main-header" *ngIf="mostrarHeader">
    <div class="header-content">
      <div class="brand-box">
        <img src="/icon-192.png" alt="FRUGALP" class="brand-icon" />
        <div>
          <h1 class="brand-title">FRUGALP</h1>
          <p class="brand-subtitle">Control Agrícola & Horómetros</p>
        </div>
      </div>

      <!-- Cuenta: un solo botón con el nombre que despliega un dropdown compacto (rol, Política, Menú, Cerrar
           sesión) anclado debajo - no un modal centrado. Se cierra tocando afuera (cuenta-overlay, transparente)
           o al navegar (ver menuCuentaAbierto en app.ts). -->
      <div class="cuenta-box" *ngIf="authService.perfil() as perfil; else soloPolitica">
        <button type="button" class="cuenta-trigger" (click)="menuCuentaAbierto.set(!menuCuentaAbierto())">
          <span class="cuenta-nombre">{{ perfil.nombre_completo }}</span>
          <span class="cuenta-caret" [class.abierto]="menuCuentaAbierto()">▾</span>
        </button>

        <div class="cuenta-overlay" *ngIf="menuCuentaAbierto()" (click)="menuCuentaAbierto.set(false)"></div>

        <div class="cuenta-dropdown" *ngIf="menuCuentaAbierto()">
          <div class="cuenta-info">
            <span class="sesion-nombre">{{ perfil.nombre_completo }}</span>
            <span class="sesion-rol">{{ perfil.rol }}{{ perfil.hacienda_nombre ? ' · ' + perfil.hacienda_nombre : '' }}</span>
          </div>

          <!-- BOTÓN DINÁMICO: oculto para roles cautivos (MECANICO/OPERADOR) o cuando ya estamos en su "hogar" -->
          <a *ngIf="mostrarBotonMenu" [routerLink]="menuButtonLink" class="cuenta-opcion" (click)="menuCuentaAbierto.set(false)">
            {{ menuButtonText }}
          </a>
          <button type="button" class="cuenta-opcion" (click)="terminosService.abrir(); menuCuentaAbierto.set(false)">
            Política de Privacidad
          </button>
          <button type="button" class="cuenta-opcion cuenta-opcion-salir" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      </div>
      <ng-template #soloPolitica>
        <button type="button" (click)="terminosService.abrir()" class="link-politica">
          Política de Privacidad
        </button>
      </ng-template>
    </div>
  </header>

  <!-- Contenedor Dinámico -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Notificaciones y confirmaciones globales (con estilos propios, sin depender de alert()/confirm() del navegador) -->
  <app-toast></app-toast>
  <app-confirm-modal></app-confirm-modal>
  <!-- Gate de Terminos: vive fuera del router-outlet para poder bloquear cualquier pantalla (ver terminos-modal.ts) -->
  <app-terminos-modal></app-terminos-modal>
</div>
