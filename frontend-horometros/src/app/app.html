<div class="layout-container">
  <!-- Header Principal Global -->
  <header class="main-header" *ngIf="mostrarHeader">
    <div class="header-content">
      <div class="brand-box">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">FRUGALP</h1>
          <p class="brand-subtitle">Control Agrícola & Horómetros</p>
        </div>
      </div>

      <div class="header-acciones">
        <!-- Sesión activa: nombre + rol (y hacienda si la cuenta tiene una fija) + botón de salir -->
        <div class="sesion-chip" *ngIf="authService.perfil() as perfil">
          <span class="sesion-nombre">{{ perfil.nombre_completo }}</span>
          <span class="sesion-rol">{{ perfil.rol }}{{ perfil.hacienda_nombre ? ' · ' + perfil.hacienda_nombre : '' }}</span>
        </div>
        <button type="button" (click)="terminosService.abrir()" class="link-politica">
          Política de Privacidad
        </button>

        <button type="button" *ngIf="authService.estaAutenticado()" (click)="cerrarSesion()" class="btn-menu">
          Cerrar sesión
        </button>

        <!-- BOTÓN DINÁMICO: oculto para roles cautivos (MECANICO/OPERADOR) o cuando ya estamos en su "hogar" -->
        <a *ngIf="mostrarBotonMenu" [routerLink]="menuButtonLink" class="btn-menu">
          {{ menuButtonText }}
        </a>
      </div>
    </div>
  </header>

  <!-- Contenedor Dinámico -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Notificaciones y confirmaciones globales (con estilos propios, sin depender de alert()/confirm() del navegador) -->
  <app-toast></app-toast>
  <app-confirm-modal></app-confirm-modal>
  <!-- Gate de Terminos: vive fuera del router-outlet para poder bloquear cualquier pantalla (ver terminos-modal.ts) -->
  <app-terminos-modal></app-terminos-modal>
</div>
