<div class="login-container">
  <div class="card login-card">
    <div class="login-header">
      <div class="login-icon">
        <svg xmlns="http://www.w3.org/2000/svg" class="login-icon-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <h1 class="login-title">FRUGALP</h1>
      <p class="login-subtitle">Ingresa con tu usuario y clave</p>
    </div>

    <form (ngSubmit)="ingresar()" class="login-form">
      <div class="alert alert-danger" *ngIf="errorLogin()">
        {{ errorLogin() }}
      </div>

      <div class="form-group">
        <label class="form-label" for="usuario">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          class="input-control login-input"
          autocomplete="username"
          [(ngModel)]="usuario"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="clave">Clave</label>
        <div class="campo-clave">
          <input
            id="clave"
            name="clave"
            [type]="mostrarClave() ? 'text' : 'password'"
            class="input-control login-input"
            autocomplete="current-password"
            [(ngModel)]="clave"
            required
          />
          <button type="button" class="boton-ojo" (click)="mostrarClave.set(!mostrarClave())" [attr.aria-label]="mostrarClave() ? 'Ocultar clave' : 'Mostrar clave'">
            {{ mostrarClave() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-boton" [disabled]="cargando() || !usuario || !clave">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
