<div class="asistencia-container">
  <div class="header-banner">
    <div>
      <h2 class="main-title">Escanear Trabajador</h2>
      <p class="subtitle">Apunta la cámara al QR que aparece en el celular del trabajador</p>
    </div>
  </div>

  <div class="card shadow-sm">
    @if (escanearActivo) {
      <div class="scanner-container">
        <div class="scanner-wrapper">
          <zxing-scanner
            [videoConstraints]="{ width: { ideal: 1280 }, height: { ideal: 720 } }"
            (scanComplete)="onCodeResult($event)"
          ></zxing-scanner>
          <!-- Solo visual: marca la zona donde SI se acepta un QR (ver zona-captura.util.ts, onCodeResult). El
          margen oscurecido de afuera no se recorta de la foto de evidencia, solo deja de ser zona de escaneo. -->
          <div class="zona-activa-overlay" aria-hidden="true"></div>
        </div>
      </div>
    }

    @if (mensajeEscaneo) {
      <div class="alert-container">
        <div [class]="tipoMensaje === 'exito' ? 'alert alert-success' : 'alert alert-danger'">
          {{ mensajeEscaneo }}
        </div>
      </div>
    }
  </div>

  <app-modal-actividad
    [mostrar]="mostrarModalActividad"
    (seleccionar)="confirmarSalidaConActividad($event)"
    (cancelar)="cerrarModalActividad()"
  >
  </app-modal-actividad>
</div>
