@if (tieneFoto) {
  <button type="button" class="btn btn-secondary btn-sm" (click)="abrir()">📷 Ver Evidencia</button>
} @else {
  <span class="text-muted-sm">Sin foto</span>
}

@if (mostrarModal) {
  <div class="modal-backdrop" (click)="cerrar()">
    <div class="visor-foto-card" (click)="$event.stopPropagation()">
      <button type="button" class="visor-foto-cerrar" (click)="cerrar()">✕</button>
      @if (cargando) {
        <div class="text-muted-sm">Cargando evidencia...</div>
      }
      @if (error) {
        <div class="text-muted-sm">{{ error }}</div>
      }
      @if (fotoUrl) {
        <img [src]="fotoUrl" alt="Evidencia de asistencia" class="visor-foto-imagen" />
      }
    </div>
  </div>
}
